[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royaleimitate"
version = "0.2.11"
description = "RoyaleImitate: imitation learning for RoyaleLearn, as an optional add-on"
requires-python = ">=3.12"
license = { text = "MIT" }
# Both come from PyPI, or, when working on the code, from sibling checkouts installed editable
# first (RoyaleSim -> RoyaleGym -> RoyaleViser -> RoyaleLearn -> RoyaleImitate), which pip then
# takes as already installed.
dependencies = [
    "royalelearn>=0.5.12",
    "royalegym>=0.1.0",
    "numpy>=2.0",
    "msgspec>=0.18",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
    "safetensors>=0.4",
]
# Human games from the IL_Replay dataset (``royaleimitate.from_replays``).
replays = [
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pyarrow>=15",
]

# How RoyaleLearn finds the two config sections this package provides. The entry point's name is
# the section's key.
[project.entry-points."royalelearn.extensions"]
imitation = "royaleimitate.extension:EXTENSION"
warm_start = "royaleimitate.warm_start:EXTENSION"

[project.scripts]
royaleimitate = "royaleimitate.cli:main"

# Naming the package explicitly keeps anything else in this folder out of a wheel built here.
[tool.setuptools.packages.find]
include = ["royaleimitate", "royaleimitate.*"]

[tool.setuptools.package-data]
royaleimitate = ["replay_cards.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m \"not slow and not engine\""
markers = [
    "slow: takes more than about five seconds",
    "engine: needs a royalesim build that matches the data on disk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["royaleimitate", "tests"]
extend-exclude = ["datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["royaleimitate", "royalelearn", "royalegym", "royalesim"]
